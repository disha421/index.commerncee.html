let cart = [];


function displayProducts() {
    const search = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const category = document.getElementById("categoryFilter").value;
    const sort = document.getElementById("sortFilter").value;

    // Filter products by search and category
    let filteredProducts = products.filter(product => {
        const matchesSearch =
            product.name.toLowerCase().includes(search);

        const matchesCategory =
            category === "All" || product.category === category;

        return matchesSearch && matchesCategory;
    });

    if (sort === "low") {
        filteredProducts.sort((a, b) => a.price - b.price);
    }

    if (sort === "high") {
        filteredProducts.sort((a, b) => b.price - a.price);
    }

    if (sort === "discount") {
        filteredProducts.sort((a, b) => {
            const discountA = (a.mrp - a.price) / a.mrp;
            const discountB = (b.mrp - b.price) / b.mrp;

            return discountB - discountA;
        });
    }

    const grid = document.getElementById("productGrid");

    if (filteredProducts.length === 0) {
        grid.innerHTML = "<p>No products found. Try another search.</p>";
        return;
    }

    grid.innerHTML = filteredProducts.map(product => {
        const discount = Math.round(
            ((product.mrp - product.price) / product.mrp) * 100
        );

        return `
            <article class="product-card">

                <div class="image-container">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        loading="lazy"
                    >

                    <span class="image-label">
                        ${discount}% OFF
                    </span>
                </div>

                <div class="product-info">

                    <span class="category">
                        ${product.category}
                    </span>

                    <h3>${product.name}</h3>

                    <div>
                        <span class="price">
                            ₹${product.price.toLocaleString("en-IN")}
                        </span>

                        <span class="mrp">
                            ₹${product.mrp.toLocaleString("en-IN")}
                        </span>
                    </div>

                    <p class="discount">
                        You save ₹${(product.mrp - product.price).toLocaleString("en-IN")}
                    </p>

                    <div class="card-buttons">

                        <button
                            class="details-btn"
                            onclick="showDetails(${product.id})"
                        >
                            Details
                        </button>

                        <button
                            class="add-btn"
                            onclick="addToCart(${product.id})"
                        >
                            Add to Cart
                        </button>

                    </div>
                </div>
            </article>
        `;
    }).join("");
}


function showDetails(id) {
    const product = products.find(item => item.id === id);

    if (!product) return;

    const savings = product.mrp - product.price;

    alert(
        "PRODUCT DETAILS\n\n" +
        "Name: " + product.name +
        "\nCategory: " + product.category +
        "\nSelling Price: ₹" + product.price.toLocaleString("en-IN") +
        "\nOriginal Price: ₹" + product.mrp.toLocaleString("en-IN") +
        "\nYou Save: ₹" + savings.toLocaleString("en-IN")
    );
}


function addToCart(id) {
    const product = products.find(item => item.id === id);

    if (!product) return;

    const existingItem = cart.find(item => item.id === id);

    if (existingItem) {
        existingItem.quantity++;
    } else {
        cart.push({
            ...product,
            quantity: 1
        });
    }

    updateCart();

    alert(product.name + " added to your cart!");
}


function changeQuantity(id, amount) {
    const item = cart.find(product => product.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
    }

    updateCart();
}


function removeFromCart(id) {
    cart = cart.filter(product => product.id !== id);

    updateCart();
}


function updateCart() {
    const totalItems = cart.reduce(
        (sum, item) => sum + item.quantity,
        0
    );

    const totalPrice = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    document.getElementById("cartCount").textContent = totalItems;

    document.getElementById("cartTotal").textContent =
        totalPrice.toLocaleString("en-IN");

    const cartItems = document.getElementById("cartItems");

    if (cart.length === 0) {
        cartItems.innerHTML = "<p>Your cart is empty.</p>";
        return;
    }

    cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">

            <div>
                <strong>${item.name}</strong>
                <br>

                ₹${item.price.toLocaleString("en-IN")}
                × ${item.quantity}

                = ₹${(item.price * item.quantity).toLocaleString("en-IN")}
            </div>

            <div>
                <button
                    aria-label="Decrease quantity"
                    onclick="changeQuantity(${item.id}, -1)"
                >
                    −
                </button>

                <button
                    aria-label="Increase quantity"
                    onclick="changeQuantity(${item.id}, 1)"
                >
                    +
                </button>

                <button
                    class="remove-btn"
                    onclick="removeFromCart(${item.id})"
                >
                    Remove
                </button>
            </div>

        </div>
    `).join("");
}


function toggleCart() {
    const section = document.getElementById("cartSection");

    const isHidden = getComputedStyle(section).display === "none";

    section.style.display = isHidden ? "block" : "none";

    if (isHidden) {
        updateCart();

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}


function checkout() {
    if (cart.length === 0) {
        alert("Your shopping cart is empty!");
        return;
    }

    alert(
        "Thank you for shopping with ShopEase!\n\n" +
        "Your total is ₹" +
        cart.reduce((sum, item) => sum + item.price * item.quantity, 0)
            .toLocaleString("en-IN") +
        "\n\nThis is a demo checkout. No real payment was made."
    );
}


displayProducts();
updateCart();

</script>

</body>
</html>
